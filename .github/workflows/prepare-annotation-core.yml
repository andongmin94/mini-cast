name: Prepare annotation core improvements

on:
  push:
    branches: [perf/annotation-core-20260905]
    paths:
      - .github/core-hardening/**
      - .github/workflows/prepare-annotation-core.yml

permissions:
  contents: write

concurrency:
  group: prepare-annotation-core
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/annotation-core-20260905
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Apply scoped source improvements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/core-hardening/apply.py')
          s = p.read_text(encoding='utf-8')
          old = "s = replace(s, 'stroke: cloneAnnotationStroke(stroke),', 'stroke,')"
          new = "s = replace(s, '      stroke: cloneAnnotationStroke(stroke),', '      stroke,')"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python .github/core-hardening/measure.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AnnotationSurface.tsx')
          s = p.read_text(encoding='utf-8')
          assert s.count('  useCallback,') == 1
          assert s.count('export default function AnnotationSurface(') == 1
          s = s.replace('  useCallback,', '  memo,\n  useCallback,')
          s = s.replace('export default function AnnotationSurface(', 'function AnnotationSurface(')
          s += '\n// Cursor position and keyboard display updates do not change annotation props.\nexport default memo(AnnotationSurface);\n'
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install locked tooling
        run: npm ci --ignore-scripts
      - name: Format modified source
        run: >-
          npx prettier --write
          src/annotation/history.ts src/annotation/geometry.ts src/annotation/eraser-index.ts
          src/components/AnnotationSurface.tsx src/electron/interaction-smoke.ts
          tests/annotation-history.test.mjs tests/annotation-immutability.test.mjs tests/eraser-index.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Domain and geometry regressions
        run: xvfb-run -a npm test
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Commit only verified application changes to review branch
        shell: bash
        run: |
          set -euo pipefail
          git add src tests package.json package-lock.json README.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: share immutable annotation state and accelerate exact eraser queries'
          git push origin HEAD:refs/heads/perf/annotation-core-20260905
