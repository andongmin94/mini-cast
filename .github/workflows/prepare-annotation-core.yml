name: Prepare annotation core improvements

on:
  push:
    branches: [perf/annotation-core-20260905]
    paths:
      - .github/workflows/prepare-annotation-core.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/annotation-core-20260905
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Add native eraser cancellation regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/electron/interaction-smoke.ts')
          s = p.read_text(encoding='utf-8')
          old = '      const beforeCancellation = annotationHistory.getSnapshot(primary.id);'
          assert s.count(old) == 1
          new = old + '''
                await selectTool("eraser");
                await waitForOverlayInput(primary.id, true);
                try {
                  await injectWindowsMouseButton(start.x, start.y, true);
                  await injectWindowsMouseMove(end.x, end.y);
                  await waitForCommittedCanvasInk(primary.id, false, "held eraser preview removes the pen pixels");
                  await shortcutCommand("undo");
                  await waitFor(
                    async () => !(await rebuiltOverlay.webContents.executeJavaScript(
                      "Boolean(document.querySelector('[data-active-gesture]'))",
                    )),
                    5_000,
                    "Ctrl+Z cancels the held eraser gesture",
                  );
                  await waitForCommittedCanvasInk(primary.id, true, "cancelled eraser preview restores the pen pixels");
                  if (annotationHistory.getSnapshot(primary.id).revision !== beforeCancellation.revision) {
                    throw new Error("Cancelling the eraser changed committed history");
                  }
                } finally {
                  await injectWindowsMouseButton(end.x, end.y, false);
                }
                diagnostics.heldEraserUndo = true;
          '''
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Install locked tooling
        run: npm ci --ignore-scripts
      - name: Format modified source
        run: npx prettier --write src/electron/interaction-smoke.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Domain and geometry regressions
        run: xvfb-run -a npm test
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Commit verified regression scenario only
        shell: bash
        run: |
          set -euo pipefail
          git add src/electron/interaction-smoke.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: verify held eraser cancellation restores pixels without touching history'
          git push origin HEAD:refs/heads/perf/annotation-core-20260905
