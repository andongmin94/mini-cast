name: Dispatch requested verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/dispatch-verification.yml]
permissions:
  contents: write
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Remove this dispatcher without changing product source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 0cd1b419e1b4f81e92434a06cbaaced728d053a5
          git diff --exit-code 0cd1b419e1b4f81e92434a06cbaaced728d053a5 HEAD -- . ':!.github/workflows/dispatch-verification.yml'
          git rm .github/workflows/dispatch-verification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finish integration hardening with only manual verification workflow'
          git push origin HEAD:main
          echo "VERIFICATION_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch the existing manual-only Verify for the clean main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api repos/andongmin94/mini-cast/git/ref/heads/main --jq '.object.sha')
          test "$CURRENT" = "$VERIFICATION_SOURCE"
          gh workflow run verify.yml --repo andongmin94/mini-cast --ref main
          echo "VERIFY_DISPATCHED source=$VERIFICATION_SOURCE"
