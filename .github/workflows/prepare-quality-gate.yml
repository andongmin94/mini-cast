name: Validate assembled quality fixes

on:
  push:
    branches: [fix/quality-gate-20260905]
    paths: [.github/workflows/prepare-quality-gate.yml]

permissions:
  contents: write

concurrency:
  group: quality-gate-assembly
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/quality-gate-20260905
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Update the two vulnerable transitive dependencies within existing ranges
        run: npm update fast-uri @xmldom/xmldom --package-lock-only --ignore-scripts
      - name: Verify the complete dependency graph
        run: npm audit --audit-level=low
      - name: Commit the lockfile to the review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: update fast-uri and xmldom security patches'
            git push origin HEAD:refs/heads/fix/quality-gate-20260905
          fi
      - name: Install locked tooling
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Domain regressions with a display for the native hook library
        run: xvfb-run -a npm test
      - name: Lint
        run: npm run lint
