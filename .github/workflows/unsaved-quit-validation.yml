name: Unsaved annotation exit validation

# One requested integration run. Removed from the source before publishing.
on:
  push:
    branches: [main]
    paths: [.github/workflows/unsaved-quit-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unsaved-quit-validation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.publish.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Apply reviewed source integration with exact base checks
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import subprocess, json
          base = '227551a0a3d009792aec18997b864d6069cf8fc1'
          modules = '960042d6a1af034bbdf74a4b2c16385908b7980a'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          git('fetch','--depth=1','origin',base)
          git('diff','--exit-code',base,'HEAD','--','.',':!.github/workflows/unsaved-quit-validation.yml')
          git('fetch','--depth=1','origin',modules)
          paths = ['src/electron/annotation-save-state.ts','src/electron/quit-coordinator.ts',
                   'src/electron/testing/unsaved-quit-smoke.ts','tests/unit/electron/annotation-save-state.test.mjs',
                   'tests/unit/electron/unsaved-quit.test.mjs']
          git('checkout',modules,'--',*paths)
          def edit(name, old, new, count=1):
              p=Path(name); s=p.read_text(encoding='utf-8')
              assert s.count(old)==count, (name,old[:100],s.count(old),count)
              p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          def append(name, text):
              with Path(name).open('a',encoding='utf-8',newline='\n') as f: f.write(text)
          p=Path('src/electron/main.ts')
          p.write_text('import { AnnotationSaveState } from "./annotation-save-state.js";\nimport { acceptUnsavedSmokeQuit } from "./testing/unsaved-quit-smoke.js";\n'+p.read_text(encoding='utf-8'),encoding='utf-8',newline='\n')
          edit(str(p),'const annotationIo = new AnnotationIoGate();','const annotationIo = new AnnotationIoGate();\nconst annotationSaveState = new AnnotationSaveState();')
          edit(str(p),'let shuttingDown = false;','let shuttingDown = false;\nlet quitDialogOpen = false;')
          edit(str(p),'  publication: () => annotationIo.publication,','''  publication: () => annotationIo.publication,
            busy: () => annotationIo.busy || displayRebuildInProgress,
            unsaved: getUnsavedAnnotationKey,
            confirm: confirmUnsavedAnnotations,''')
          edit(str(p),'function connectedDisplayIds(','''function getUnsavedAnnotationKey() {
            return annotationSaveState.key(overlayDisplays.map(display => annotationHistory.getSnapshot(display.id)));
          }

          async function confirmUnsavedAnnotations(): Promise<boolean> {
            const controller = mainWindow;
            if (!controller || controller.isDestroyed() || annotationIo.busy || displayRebuildInProgress) return false;
            const count = overlayDisplays.filter(display => annotationSaveState.isDirty(annotationHistory.getSnapshot(display.id))).length;
            const abort = new AbortController();
            const invalidate = () => abort.abort();
            quitDialogOpen = true;
            cancelActiveAnnotationGestures();
            refreshTransientAnnotationShortcuts();
            setOverlayInteractive(false);
            setAnnotationInputMode(false);
            showMainWindow();
            controller.on("hide", invalidate);
            controller.on("minimize", invalidate);
            controller.on("closed", invalidate);
            controller.webContents.on("did-start-loading", invalidate);
            controller.webContents.on("destroyed", invalidate);
            try {
              const result = await dialog.showMessageBox(controller, {
                type: "warning", title: "저장하지 않은 판서",
                message: `${count}개 화면에 저장하지 않은 판서가 있습니다.`,
                detail: "종료하면 현재 판서를 잃습니다. 보관하려면 돌아가서 각 화면을 .minicast 파일로 저장하세요. PNG·이미지 복사는 편집 가능한 파일 저장을 대신하지 않습니다.",
                buttons: ["돌아가기", "저장하지 않고 종료"], defaultId: 0, cancelId: 0, noLink: true, signal: abort.signal,
              });
              return result.response === 1 && !abort.signal.aborted;
            } finally {
              controller.removeListener("hide", invalidate);
              controller.removeListener("minimize", invalidate);
              controller.removeListener("closed", invalidate);
              controller.webContents.removeListener("did-start-loading", invalidate);
              controller.webContents.removeListener("destroyed", invalidate);
              quitDialogOpen = false;
              if (!shuttingDown) {
                const interactive = annotationTool !== "pass-through";
                setOverlayInteractive(interactive);
                setAnnotationInputMode(interactive);
                refreshTransientAnnotationShortcuts();
              }
            }
          }

          function connectedDisplayIds(''')
          edit(str(p),'  if (annotationTool === "pass-through" || controllerTextEditing) return;','  if (annotationTool === "pass-through" || controllerTextEditing || quitDialogOpen) return;')
          edit(str(p),'function setAnnotationTool(tool: AnnotationTool) {','function setAnnotationTool(tool: AnnotationTool) {\n  if (quitDialogOpen) { sendAnnotationState(); return; }')
          edit(str(p),'  if (displayRebuildInProgress) return;','  if (displayRebuildInProgress || quitDialogOpen) return;')
          edit(str(p),'unavailable: () => shuttingDown || displayRebuildInProgress || controllerTextEditing || Boolean(textEdits.current),','unavailable: () => shuttingDown || displayRebuildInProgress || quitDialogOpen || controllerTextEditing || Boolean(textEdits.current),',2)
          edit(str(p),'    history: annotationHistory, gate: annotationIo,','''    history: annotationHistory, gate: annotationIo,
              saved: snapshot => {
                if (connectedDisplayIds().includes(snapshot.displayId)) annotationSaveState.markSaved(snapshot);
              },''')
          edit(str(p),'    if (shuttingDown || displayRebuildInProgress || controllerTextEditing || textEdits.current ||','    if (shuttingDown || displayRebuildInProgress || quitDialogOpen || controllerTextEditing || textEdits.current ||')
          edit(str(p),'      annotationTool === "pass-through" ||','      annotationTool === "pass-through" || quitDialogOpen ||')
          edit(str(p),'    annotationHistory.retainDisplays(connectedIds);','    annotationHistory.retainDisplays(connectedIds);\n    annotationSaveState.retainDisplays(connectedIds);')
          edit(str(p),'    gate: annotationIo,\n    quitWaiting:','    gate: annotationIo,\n    saved: annotationSaveState,\n    quitWaiting:')
          edit(str(p),'mode === "interaction" ? 180_000 : 30_000','mode === "interaction" ? 240_000 : 30_000')
          edit(str(p),'  void publication.then(release, release);\n  app.quit();','''  void publication.then(release, release);
            const discard = getUnsavedAnnotationKey() !== null ? acceptUnsavedSmokeQuit() : Promise.resolve();
            app.quit();
            await discard;''')
          p=Path('src/electron/annotation-files.ts')
          edit(str(p),'import type { AnnotationHistory }','import type { AnnotationHistory, AnnotationDocumentSnapshot }')
          edit(str(p),'  documentChanged(displayId: number): void;','  documentChanged(displayId: number): void;\n  saved(snapshot: AnnotationDocumentSnapshot): void;')
          edit(str(p),'        await lifetime.publish(options.gate, () => saveAnnotationFile(result.filePath!, serialized));','''        await lifetime.publish(options.gate, async () => {
                    await saveAnnotationFile(result.filePath!, serialized);
                    options.saved(original);
                  });''')
          edit(str(p),'      if (changed) options.documentChanged(request.displayId);','''      options.saved(options.history.getSnapshot(request.displayId));
                if (changed) options.documentChanged(request.displayId);''')
          p=Path('src/electron/testing/interaction-smoke.ts')
          p.write_text('import { verifyUnsavedQuit } from "./unsaved-quit-smoke.js";\nimport type { AnnotationSaveState } from "../annotation-save-state.js";\n'+p.read_text(encoding='utf-8'),encoding='utf-8',newline='\n')
          edit(str(p),'export interface SmokeContext {','export interface SmokeContext {\n  saved: AnnotationSaveState;')
          edit(str(p),'      diagnostics.documentFiles = await verifyAnnotationFiles({','      diagnostics.documentFiles = await verifyAnnotationFiles({\n        saved: context.saved,')
          edit(str(p),'    } finally {\n      if (!underlay.isDestroyed()) underlay.destroy();','''      diagnostics.unsavedQuit = await verifyUnsavedQuit({
                  history: annotationHistory, saved: context.saved, quitWaiting: context.quitWaiting,
                  publishDocument: context.publishDocument,
                }, primary.id);
              } finally {
                if (!underlay.isDestroyed()) underlay.destroy();''')
          p=Path('src/electron/testing/document-file-smoke.ts')
          p.write_text('import type { AnnotationSaveState } from "../annotation-save-state.js";\n'+p.read_text(encoding='utf-8'),encoding='utf-8',newline='\n')
          edit(str(p),'interface Context {','interface Context {\n  saved: AnnotationSaveState;')
          edit(str(p),'  const beforeOpen = history.getSnapshot(displayId), beforePixels = await pixels();','''  if (!context.saved.isDirty(history.getSnapshot(displayId))) throw new Error("Pinned save marked newer edits as saved");
            const beforeOpen = history.getSnapshot(displayId), beforePixels = await pixels();''')
          edit(str(p),'  const openedPixels = await pixels();','''  if (context.saved.isDirty(history.getSnapshot(displayId))) throw new Error("Opened file was not a clean baseline");
            const openedPixels = await pixels();''')
          edit(str(p),'  await context.command("redo");','''  if (!context.saved.isDirty(history.getSnapshot(displayId))) throw new Error("Undo of file open lost dirty state");
            await context.command("redo");''')
          edit(str(p),'  const stable = history.getSnapshot(displayId);','''  if (context.saved.isDirty(history.getSnapshot(displayId))) throw new Error("Redo of file open did not restore saved contents");
            const stable = history.getSnapshot(displayId);''')
          edit(str(p),'    cancel: true, invalidFile: true,','    savedState: true, cancel: true, invalidFile: true,')
          p=Path('tests/unit/electron/io-lifecycle.test.mjs')
          edit(str(p),'new QuitCoordinator({ publication:', 'new QuitCoordinator({ busy: () => false, unsaved: () => null, confirm: async () => true, publication:',2)
          p=Path('src/electron/testing/unsaved-quit-smoke.ts')
          edit(str(p),'  for (const cancel of ["Enter", "Escape"]) {','''  const exported = await controller.webContents.executeJavaScript(`miniCast.exportAnnotation({displayId:${displayId},destination:'clipboard'})`);
            if (exported.status !== "copied" || !context.saved.isDirty(original)) throw new Error("PNG copy incorrectly marked editable work as saved");
            for (const cancel of ["Enter", "Escape"]) {''')
          edit(str(p),'return { defaultCancel: true,','return { pngNotSaved: true, defaultCancel: true,')
          append('scripts/verify-source.ps1','''\nif ((Get-Content -LiteralPath (Join-Path $userData 'quit-discard.txt') -Raw) -ne 'confirmed') { throw 'Explicit discard was not exercised before exit.' }
          if (-not $payload.diagnostics.unsavedQuit.defaultCancel -or -not $payload.diagnostics.unsavedQuit.escapeCancel -or -not $payload.diagnostics.unsavedQuit.pngNotSaved -or -not $payload.diagnostics.documentFiles.savedState) { throw 'Unsaved-document boundaries were not verified.' }
          ''')
          edit('scripts/verify-windows.ps1','    $saved = Get-Content -LiteralPath (Join-Path $userData \'config.json\') -Raw | ConvertFrom-Json','''    if ($Mode -eq 'interaction' -and (Get-Content -LiteralPath (Join-Path $userData 'quit-discard.txt') -Raw) -ne 'confirmed') { throw "$Label did not explicitly confirm unsaved discard." }
              $saved = Get-Content -LiteralPath (Join-Path $userData 'config.json') -Raw | ConvertFrom-Json''')
          edit('scripts/verify-windows.ps1','-TimeoutSeconds 210','-TimeoutSeconds 300',2)
          append('scripts/verify-diagnostics.ps1','''\nforeach ($file in @('unpacked-interaction-sentinel.json', 'unpacked-software-interaction-sentinel.json')) {
            $result = Get-Content -LiteralPath (Join-Path 'verification-logs' $file) -Raw | ConvertFrom-Json
            $quit = $result.diagnostics.unsavedQuit
            if (-not $quit.defaultCancel -or -not $quit.escapeCancel -or -not $quit.repeatedQuit -or -not $quit.documentPreserved -or -not $quit.pngNotSaved -or -not $result.diagnostics.documentFiles.savedState) { throw 'Packaged unsaved-document protection missing.' }
          }
          ''')
          for name in ('package.json','package-lock.json'):
              p=Path(name); data=json.loads(p.read_text(encoding='utf-8')); assert data['version']=='0.14.1'
              data['version']='0.14.2'
              if name=='package-lock.json': data['packages']['']['version']='0.14.2'
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          edit('docs/ANNOTATION-TOOLS.md','현재 문서 기준은 0.14.1','현재 문서 기준은 0.14.2')
          append('docs/ANNOTATION-TOOLS.md','''\n\n## 미저장 판서의 정상 종료 보호 (0.14.2)\n\n확정된 판서가 마지막으로 저장하거나 연 .minicast 내용과 다르면 정상 종료에서 ‘저장하지 않은 판서’를 확인합니다. 기본 버튼과 Enter·Escape는 ‘돌아가기’이며, ‘저장하지 않고 종료’를 명시적으로 선택해야 버립니다. 돌아간 뒤 기존 파일 저장·열기 UI로 화면별로 저장합니다. 이 대화상자 자체에는 자동 저장 기능이 없습니다.\n\n저장 완료 전에는 저장됐다고 표시하지 않으며, 이전 시점의 저장이 끝나도 이후 편집은 미저장으로 남습니다. Undo/Redo로 저장된 내용에 정확히 돌아오면 경고를 없앱니다. PNG·클립보드·보드 배경·설정 저장은 편집 파일 저장으로 간주하지 않습니다. 빈 새 화면은 경고하지 않지만, 저장한 객체를 모두 지운 변경은 확인합니다.\n\n모든 연결된 화면의 미저장 상태를 확인하고, 확인 도중 문서 내용이 바뀌면 이전 폐기 승인을 재사용하지 않습니다. 종료 확인 중에는 판서 단축키와 포인터를 잠시 막고 취소하면 복원합니다. 파일 선택창·화면 재구성이 진행 중이면 종료를 보류하며 중복 대화상자를 쌓지 않습니다. 승인된 실제 쓰기는 기존처럼 성공·실패를 기다립니다.\n\n보호 대상은 현재 연결된 화면의 확정 문서입니다. 아직 배치하지 않은 텍스트 초안, 분리된 모니터의 폐기된 문서, 운영체제 강제 종료·로그아웃·프로세스 강제 종료의 복구나 자동 저장은 포함하지 않습니다.\n''')
          append('docs/CHANGELOG.md','''\n\n## 0.14.2\n\n- 내용 기반 저장 상태와 다중 화면 정상 종료 확인.\n- 기본 취소·명시적 폐기·중복 종료 요청 병합·오래된 폐기 승인 재확인.\n- 실제 저장/열기·Undo/Redo·PNG 격리와 Windows 종료 대화상자 회귀 검사.\n- 입력별 대기 제한은 유지하고 추가 종료 시나리오를 포함한 전체 테스트 시간 상한 정리.\n''')
          edit('README.md','자동 저장과 배경 화면 캡처는 지원하지 않습니다.','미저장된 확정 판서는 정상 종료 전에 확인하며 기본값은 돌아가기입니다. 자동 저장과 배경 화면 캡처는 지원하지 않습니다.')
          print('UNSAVED_QUIT_INTEGRATION_APPLIED version=0.14.2')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit candidate without the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/unsaved-quit-validation.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect unsaved annotation documents on normal exit'
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=low
      - name: Publish checked source directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:main
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      MINICAST_SOURCE_SHA: ${{ needs.prepare.outputs.source }}
    steps:
      - name: Fresh checkout of the exact published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=low
      - run: npx vite build && npm run build:electron
      - name: Native source tests including unsaved cancellation and discard
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - run: npm run build
      - name: Packaged native input, quit dialogs, portable and MSI lifecycle
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/verify-windows.ps1
      - shell: pwsh
        run: ./scripts/verify-diagnostics.ps1
      - shell: pwsh
        run: ./scripts/package-bundle.ps1
      - shell: pwsh
        run: ./tests/windows/bundle-provenance.test.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-windows
          path: |
            output/MiniCast-*-windows.zip
            output/SHA256SUMS.txt
            output/BUILD-METADATA.json
            output/BUNDLE-SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mini-cast-verification-logs
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 14
