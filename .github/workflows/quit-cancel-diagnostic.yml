name: Diagnose native quit cancellation
on:
  push:
    branches: [main]
    paths: [.github/workflows/quit-cancel-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Inspect pinned Electron message-box abort without application mocks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'quit-cancel-diagnostic.cjs'
          @'
          const { app, BrowserWindow, dialog } = require('electron');
          const mode=process.argv.at(-1);
          app.whenReady().then(async()=>{
            const win=new BrowserWindow({width:416,height:420,frame:false,webPreferences:{nodeIntegration:false,contextIsolation:true}});
            await win.loadURL('data:text/html,<h1>Quit diagnostic</h1>');
            win.show(); win.focus();
            const abort=new AbortController();
            for(const name of ['hide','minimize','closed','show','focus','blur'])win.on(name,()=>{
              console.log('NATIVE_EVENT',mode,name);
              if((mode==='hide-event'&&name==='hide')||(mode==='minimize-event'&&name==='minimize'))abort.abort();
            });
            abort.signal.addEventListener('abort',()=>console.log('ABORTED',mode));
            const start=Date.now();
            const timeout=setTimeout(()=>{console.log('DIAGNOSTIC_TIMEOUT',JSON.stringify({mode,aborted:abort.signal.aborted,visible:win.isVisible(),minimized:win.isMinimized(),enabled:win.isEnabled()}));app.exit(0);},6000);
            const result=dialog.showMessageBox(win,{type:'warning',title:'저장하지 않은 판서',message:'진단',detail:'취소 동작 진단',buttons:['돌아가기','저장하지 않고 종료'],defaultId:0,cancelId:0,noLink:true,signal:abort.signal});
            setTimeout(()=>{
              console.log('TRANSITION',mode);
              if(mode==='direct')abort.abort();
              else if(mode==='hide-event')win.hide();
              else if(mode==='minimize-event')win.minimize();
              else {abort.abort();setTimeout(()=>win.hide(),50);}
            },800);
            const value=await result;clearTimeout(timeout);
            console.log('DIALOG_SETTLED',JSON.stringify({mode,value,ms:Date.now()-start}));
            win.destroy();app.exit(0);
          }).catch(e=>{console.error(e);app.exit(1);});
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          foreach ($mode in @('direct','hide-event','minimize-event','abort-before-hide')) {
            & .\node_modules\.bin\electron.cmd $script $mode
            if ($LASTEXITCODE -ne 0) { throw "Diagnostic process failed: $mode" }
          }
