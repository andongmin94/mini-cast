name: Finish native quit cancellation verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/quit-cancel-finalize.yml]
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Assert real owner visibility instead of assuming modal minimization
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import subprocess
          base='a6da147007f5a54126b3da5cbb477d55e2154a0b'
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--','.',':!.github/workflows/quit-cancel-finalize.yml'],check=True)
          p=Path('src/electron/testing/unsaved-quit-smoke.ts'); s=p.read_text(encoding='utf-8')
          start=s.index('  for (const transition of ["hide", "minimize"]) {')
          end=s.index('\n  await injectWindowsShortcut("Alt+Shift+3");\n  await injectWindowsShortcut("Alt+Shift+1");',start)
          replacement='''  for (const transition of ["hide", "reload"]) {
              await injectWindowsShortcut("Alt+Shift+3");
              await waitFor(() => isOverlayInteractive(), 5000, "pen active before quit visibility boundary");
              quitApplication(); await nativeDialog("저장하지 않은 판서");
              const effectiveTool = await controller.webContents.executeJavaScript("miniCast.getAnnotationState().then(state => state.tool)");
              if (isOverlayInteractive() || effectiveTool !== "pass-through") throw new Error("Quit prompt did not suspend board and pointer input");
              if (transition === "hide") {
                hideMainWindow();
              } else {
                controller.webContents.reload();
              }
              await waitFor(() => !context.quitWaiting(), 5000, `${transition} cancels the native quit prompt`);
              if (isOverlayInteractive() || context.history.getSnapshot(displayId) !== original)
                throw new Error(`${transition} restored blocking input or lost unsaved work`);
              if (transition === "reload") {
                await waitFor(() => !controller.webContents.isLoadingMainFrame(), 5000, "controller reload completes after quit cancellation");
                await controller.webContents.executeJavaScript("miniCast.getAnnotationState()");
              }
              showMainWindow();
              if (isOverlayInteractive()) throw new Error("Showing controller resurrected blocked annotation input");
            }
            // A Windows native modal disables its parent. Calling minimize() is a
            // no-op, not a minimize event; verify the prompt remains usable and safe.
            await injectWindowsShortcut("Alt+Shift+3");
            await waitFor(() => isOverlayInteractive(), 5000, "pen active before modal minimize attempt");
            quitApplication(); await nativeDialog("저장하지 않은 판서");
            if (controller.isEnabled()) throw new Error("Native quit prompt did not disable its parent");
            controller.minimize();
            await new Promise(resolve => setTimeout(resolve, 150));
            if (controller.isMinimized() || !context.quitWaiting() || isOverlayInteractive() ||
                context.history.getSnapshot(displayId) !== original)
              throw new Error("Blocked native parent minimization changed quit state, input or document");
            await nativeDialog("저장하지 않은 판서");
            await injectWindowsShortcut("Escape");
            await waitFor(() => !context.quitWaiting() && controller.isEnabled(), 5000, "modal cancellation re-enables the controller");
            controller.minimize();
            await waitFor(() => controller.isMinimized() && !isOverlayInteractive(), 5000, "actual minimization after modal cancellation returns to pass-through");
            showMainWindow();
            if (isOverlayInteractive() || context.history.getSnapshot(displayId) !== original)
              throw new Error("Restoring a minimized controller resurrected input or changed unsaved work");'''
          s=s[:start]+replacement+s[end:]
          old='hiddenCancel: true, minimizedCancel: true, presentationSuspended: true'
          assert s.count(old)==1
          s=s.replace(old,'hiddenCancel: true, reloadCancel: true, blockedMinimize: true, minimizedAfterCancel: true, presentationSuspended: true')
          p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('scripts/verify-diagnostics.ps1'); s=p.read_text(encoding='utf-8')
          old='-not $quit.minimizedCancel'
          assert s.count(old)==1
          s=s.replace(old,'-not $quit.reloadCancel -or -not $quit.blockedMinimize -or -not $quit.minimizedAfterCancel')
          p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('docs/ANNOTATION-TOOLS.md'); s=p.read_text(encoding='utf-8')
          old='일반 취소는 기존 도구를 복원하되 확인 중 최소화·숨김·재로딩은 조작 모드로 안전하게 돌아갑니다.'
          assert s.count(old)==1
          s=s.replace(old,'일반 취소는 기존 도구를 복원하되 실제 숨김·재로딩은 확인을 취소하고 조작 모드로 돌아갑니다. Windows 네이티브 확인창이 부모 창의 최소화를 막는 동안에는 확인창을 유지합니다. 확인을 취소한 뒤 실제로 최소화하면 조작 모드로 복귀합니다.')
          p.write_text(s,encoding='utf-8',newline='\n')
          print('NATIVE_QUIT_EXPECTATIONS_MATCH_MEASURED_WINDOWS_EVENTS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=low
      - name: Remove temporary workflows and verify the final clean source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/quit-cancel-diagnostic.yml .github/workflows/quit-cancel-finalize.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: verify native quit cancellation and modal owner lifecycle accurately'
          test -z "$(git status --porcelain)"
          git push origin HEAD:main
          echo "FINAL_SOURCE_SHA=$(git rev-parse HEAD)"
          gh workflow run verify.yml --ref main
