name: Editable annotation file validation

# One-shot validation for the requested increment; remove after successful publication.
# Normal product commits do not trigger this workflow.
on:
  push:
    branches: [main]
    paths: [.github/workflows/annotation-files-validation.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: editable-annotation-files-validation
  cancel-in-progress: true

jobs:
  editable-files:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout requested work
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Stop only the two superseded validation executions
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import { setTimeout as delay } from 'node:timers/promises';
          const repo = 'andongmin94/mini-cast';
          if (process.env.GITHUB_REPOSITORY !== repo) throw new Error('Unexpected repository');
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2026-03-10' };
          const targets = [
            { id: 33956273624, sha: '2b6e88084c32645bced57fb0674d9e82d25c4f32', attempt: 26 },
            { id: 33997642404, sha: 'c459565dd78ae0de0afe9286cd7967938860208e', attempt: 1 },
          ];
          for (const target of targets) {
            if (String(target.id) === process.env.GITHUB_RUN_ID) throw new Error('Refusing self cancellation');
            const url = `https://api.github.com/repos/${repo}/actions/runs/${target.id}`;
            const read = async () => {
              const response = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
              if (!response.ok) throw new Error(`Read run ${target.id}: ${response.status}`);
              return response.json();
            };
            const initial = await read();
            if (initial.head_sha !== target.sha || initial.run_attempt !== target.attempt || initial.head_branch !== 'main')
              throw new Error(`Run ${target.id} is not the superseded execution`);
            if (initial.status === 'completed') { console.log(`Already completed: ${target.id}`); continue; }
            const cancel = async action => {
              const response = await fetch(`${url}/${action}`, { method: 'POST', headers, signal: AbortSignal.timeout(15000) });
              if (![202, 409].includes(response.status)) throw new Error(`${action} run ${target.id}: ${response.status}`);
            };
            await cancel('cancel');
            let stopped = false;
            for (let i = 0; i < 15; i++) {
              if ((await read()).status === 'completed') { stopped = true; break; }
              await delay(1000);
            }
            if (!stopped) {
              await cancel('force-cancel');
              for (let i = 0; i < 15; i++) {
                if ((await read()).status === 'completed') { stopped = true; break; }
                await delay(1000);
              }
            }
            if (!stopped) throw new Error(`Run ${target.id} did not acknowledge cancellation`);
            console.log(`Stopped superseded execution: ${target.id}`);
          }
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply reviewed file changes and current guide
        run: |
          @'
          from pathlib import Path
          import subprocess
          script = Path('.github/reorganize.py').read_text(encoding='utf-8')
          anchor = "exec(compile(reviewed, 'reviewed-editable-file-preparation', 'exec'))"
          assert script.count(anchor) == 1, 'Reviewed preparation wrapper changed'
          patch = '''
          old = "':!.github/reorganize.py'],check=True)"
          assert reviewed.count(old) == 1, 'Reviewed base guard changed'
          reviewed = reviewed.replace(old, "':!.github/reorganize.py',':!.github/workflows/annotation-files-validation.yml'],check=True)")
          '''
          script = script.replace(anchor, patch + '\n' + anchor)
          exec(compile(script, 'requested-editable-file-validation', 'exec'))
          guide = '54d9a23b460cc7f479451a87a85a4fdb5038faad'
          subprocess.run(['git','fetch','--depth=1','origin',guide],check=True)
          content = subprocess.check_output(['git','show',guide+':docs/ANNOTATION-TOOLS.md']).decode('utf-8')
          Path('docs/ANNOTATION-TOOLS.md').write_text(content,encoding='utf-8',newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const p=require('./package.json'); if(p.version!=='0.13.0'||!p.scripts.check.includes('typecheck')) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and all tests and warning-free lint
        run: npm run check
      - name: Full dependency audit
        run: npm audit --audit-level=low
      - name: Compile source application
        run: |
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source native dialogs and editable files and Canvas verification
        timeout-minutes: 5
        run: ./scripts/verify-source.ps1
      - name: Build MSI and portable packages
        timeout-minutes: 10
        run: npm run build
      - name: Packaged native editing and document files and install lifecycle
        timeout-minutes: 10
        run: ./scripts/verify-windows.ps1
      - name: Verify every native diagnostic
        run: ./scripts/verify-diagnostics.ps1
      - name: Bundle and verify internal hashes
        run: ./scripts/package-bundle.ps1
      - name: Publish only verified source and remove preparation script
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- src tests scripts docs README.md package.json package-lock.json index.html tsconfig.electron.json eslint.config.js .prettierignore
          git diff --cached --binary > verification-logs/verified-source.patch
          git restore --worktree -- .github/reorganize.py
          git rm .github/reorganize.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: save and reopen editable annotation documents'
          git diff --exit-code
          git push origin HEAD:main
          git rev-parse HEAD > verification-logs/verified-source-commit.txt
          git ls-tree -r HEAD > verification-logs/verified-source-tree.txt
          node --input-type=module -e 'import fs from "node:fs"; import cp from "node:child_process"; const p="output/BUILD-METADATA.json"; const m=JSON.parse(fs.readFileSync(p,"utf8").replace(/^\uFEFF/,"")); m.workflow_commit=m.commit; m.commit=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(); fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n");'
      - name: Retain validated Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-windows
          path: |
            output/MiniCast-*-windows.zip
            output/SHA256SUMS.txt
            output/BUNDLE-SHA256.txt
            output/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: annotation-file-verification
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 7
