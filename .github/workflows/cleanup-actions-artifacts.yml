name: Reclaim Actions artifact storage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-actions-artifacts.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete repository Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )"

          if [ -z "$artifact_ids" ]; then
            echo 'No Actions artifacts to delete.'
            exit 0
          fi

          deleted=0
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            deleted=$((deleted + 1))
          done <<< "$artifact_ids"

          echo "Deleted ${deleted} Actions artifacts from ${GITHUB_REPOSITORY}."
