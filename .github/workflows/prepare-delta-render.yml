name: Prepare delta transport and dirty renderer

on:
  push:
    branches: [perf/delta-dirty-render-20260905]
    paths:
      - .github/delta-hardening/**
      - .github/workflows/prepare-delta-render.yml

permissions:
  contents: write

concurrency:
  group: prepare-delta-render
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/delta-dirty-render-20260905
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Integrate source changes
        run: python .github/delta-hardening/finish.py
      - name: Install locked tooling
        run: npm ci --ignore-scripts
      - name: Format changed source
        run: >-
          npx prettier --write
          src/annotation/document-sync.ts src/annotation/canvas-renderer.ts src/annotation/render-plan.ts src/annotation/history.ts
          src/electron/main.ts src/electron-api.d.ts src/components/Overlay.tsx src/components/AnnotationSurface.tsx
          src/electron/rendering-smoke.ts src/electron/interaction-smoke.ts
          tests/annotation-sync.test.mjs tests/annotation-render-plan.test.mjs
      - name: Full typecheck
        run: npm run typecheck
      - name: State and rendering regressions
        run: xvfb-run -a npm test
      - name: ESLint
        run: npm run lint
      - name: Full dependency audit
        run: npm audit --audit-level=low
      - name: Commit verified integration to review branch
        shell: bash
        run: |
          set -euo pipefail
          git add src tests package.json package-lock.json README.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: integrate revisioned annotation deltas and dirty-region recomposition'
          git push origin HEAD:refs/heads/perf/delta-dirty-render-20260905
