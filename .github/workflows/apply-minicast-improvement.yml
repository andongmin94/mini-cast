name: Apply MiniCast 0.3.1 Improvement

on:
  push:
    branches: [main]
    paths:
      - .github/improvement/minicast-0.3.1.patch.gz.b64
      - .github/improvement/verify.yml
      - .github/workflows/apply-minicast-improvement.yml

permissions:
  contents: write

concurrency:
  group: apply-minicast-0.3.1-improvement
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply audited improvement and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          expected_base='4958ba66f522e358fc0e8b44079e08ae8cd540b2'
          if ! git merge-base --is-ancestor "$expected_base" HEAD; then
            echo "Expected base is not an ancestor of the staging commit." >&2
            exit 1
          fi

          base64 --decode .github/improvement/minicast-0.3.1.patch.gz.b64 \
            | gzip --decompress > /tmp/minicast-0.3.1.patch
          echo '68aa5c6dee5fa7f4217aa19768d30908c5d73cf7fd36d8402a1b8bca1ed7724e  /tmp/minicast-0.3.1.patch' \
            | sha256sum --check

          git apply --check --exclude=.github/workflows/verify.yml /tmp/minicast-0.3.1.patch
          git apply --index --exclude=.github/workflows/verify.yml /tmp/minicast-0.3.1.patch
          cp .github/improvement/verify.yml .github/workflows/verify.yml
          git add .github/workflows/verify.yml
          git rm \
            .github/improvement/minicast-0.3.1.patch.gz.b64 \
            .github/improvement/verify.yml \
            .github/workflows/apply-minicast-improvement.yml
          git diff --cached --check

          git config user.name '안동민'
          git config user.email '110483588+andongmin94@users.noreply.github.com'
          git commit -m 'fix: harden annotation settlement and rendering'
          git push origin HEAD:main
