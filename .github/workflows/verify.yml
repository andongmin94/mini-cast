name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload synced lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build renderer
        run: npm exec vite build
      - name: Build Electron main
        run: npm run build:electron

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: output/*
