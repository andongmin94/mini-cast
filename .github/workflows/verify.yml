name: Verify

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  checks:
    if: ${{ github.event_name != 'issues' || startsWith(github.event.issue.title, '[ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload synced lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build renderer
        run: npm exec vite build
      - name: Build Electron main
        run: npm run build:electron
      - name: Commit synced lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- package-lock.json
          git commit -m "chore: sync package lock [skip ci]"
          git push origin HEAD:main

  windows-package:
    if: ${{ github.event_name != 'issues' || startsWith(github.event.issue.title, '[ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: output/*

  report:
    if: ${{ always() && github.event_name == 'issues' }}
    needs: [checks, windows-package]
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          PACKAGE_RESULT: ${{ needs.windows-package.result }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "검증 결과

- Linux 타입검사·테스트·린트·renderer/Electron 빌드: **$CHECKS_RESULT**
- Windows MSI·Portable 패키징: **$PACKAGE_RESULT**
- 실행 로그: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
