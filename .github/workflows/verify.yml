name: Verify

# Every main commit must pass the same Windows package verification used for releases.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "검증한 Windows 패키지를 현재 버전의 릴리스로 게시"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Windows 검증 및 패키징
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      MINICAST_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js 24 설치
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: 잠금 파일로 의존성 설치
        run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 및 상태 경계 테스트
        run: npm test
      - name: 린트
        run: npm run lint
      - name: 전체 의존성 보안 감사
        run: npm audit --audit-level=low
      - name: 소스 renderer 및 Electron 빌드
        run: npx vite build && npm run build:electron
      - name: 패키징 전 실제 입력·Canvas 참조 비교
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - name: MSI 및 포터블 패키징
        run: npm run build
      - name: 실제 Windows 입력·포터블·MSI 설치 검증
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/verify-windows.ps1
      - name: 판서 변경분 전송·부분 렌더링 진단
        shell: pwsh
        run: ./scripts/verify-diagnostics.ps1
      - name: 최종 ZIP 무결성 및 내부 해시 대조
        shell: pwsh
        run: ./scripts/package-bundle.ps1
      - name: 배포 출처 실패 경계 검사
        shell: pwsh
        run: ./tests/windows/bundle-provenance.test.ps1
      - name: 이전 수동 패키지 아티팩트 정리
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ids = gh api --paginate "/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "mini-cast-windows") | .id'
          foreach ($id in $ids) {
            if ($id) {
              gh api --method DELETE "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
            }
          }
      - name: Windows 산출물 업로드
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-windows
          path: |
            output/MiniCast-*-windows.zip
            output/BUNDLE-SHA256.txt
            output/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 1
      - name: 검증 진단 로그 업로드
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-verification-logs
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 1

  publish-release:
    name: 검증된 릴리스 게시
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 검증한 소스 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 검증한 Windows 산출물 다운로드
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mini-cast-windows
          path: release-artifacts
      - name: 버전 태그와 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          unzip -q "release-artifacts/MiniCast-$version-windows.zip" -d release-payload
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("package.json").read_text())["version"]
          changelog = Path("docs/CHANGELOG.md").read_text()
          section = changelog.split(f"## {version}", 1)[1].split("\n## ", 1)[0]
          section = section.split("\n", 1)[1].strip()
          run = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          notes = f"# MiniCast {version}\n\n{section}\n\n## 검증\n\nWindows 전체 검증과 MSI·포터블 검사를 통과한 산출물입니다. [검증 실행]({run})\n\n소스: `{os.environ['GITHUB_SHA']}`\n"
          Path(os.environ["RUNNER_TEMP"], "mini-cast-release-notes.md").write_text(notes)
          PY
          gh release create "v$version" \
            --target "$GITHUB_SHA" --title "v$version" --latest \
            --notes-file "$RUNNER_TEMP/mini-cast-release-notes.md" \
            "release-artifacts/MiniCast-$version-windows.zip" \
            release-artifacts/BUNDLE-SHA256.txt \
            release-payload/BUILD-METADATA.json \
            release-payload/SHA256SUMS.txt \
            "release-payload/MiniCast-$version-x64.msi" \
            release-payload/MiniCast.exe
