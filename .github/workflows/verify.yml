name: Verify

# Windows gate: production input/lifecycle, revisioned delta IPC,
# exact dirty/full Canvas equivalence, recovery and package integrity.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Windows 검증 및 패키징
    runs-on: windows-2022
    timeout-minutes: 55

    steps:
      - name: 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Node.js 24 설치
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm

      - name: 잠금 파일로 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 및 상태 경계 테스트
        run: npm test

      - name: 린트
        run: npm run lint

      - name: 전체 의존성 보안 감사
        run: npm audit --audit-level=low

      - name: 소스 renderer 및 Electron 빌드
        run: npx vite build && npm run build:electron

      - name: 패키징 전 실제 입력·Canvas 참조 비교
        timeout-minutes: 3
        shell: pwsh
        run: |
          $sentinel = Join-Path $env:RUNNER_TEMP ("mini-cast-source-" + [Guid]::NewGuid() + '.json')
          $userData = Join-Path $env:RUNNER_TEMP ("mini-cast-source-userdata-" + [Guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $userData, 'verification-logs' | Out-Null
          if (-not (Test-Path -LiteralPath 'dist/electron/main.js')) { throw 'Compiled Electron entrypoint is missing.' }
          & .\node_modules\.bin\electron.cmd . --interaction-smoke-test "--smoke-sentinel=$sentinel" "--smoke-user-data=$userData"
          $exitCode = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $sentinel)) { throw 'Source interaction did not return its diagnostic result.' }
          $payload = Get-Content -LiteralPath $sentinel -Raw | ConvertFrom-Json
          Copy-Item -LiteralPath $sentinel -Destination 'verification-logs/source-canvas.json'
          Write-Host ($payload | ConvertTo-Json -Depth 12 -Compress)
          if ($exitCode -ne 0 -or -not $payload.success) { throw "Source interaction failed: $($payload.error)" }
          if (-not $payload.diagnostics.dirtyCanvasReference.success -or -not $payload.diagnostics.deltaTransport.gapRecovered) {
            throw 'Source Canvas/delta coverage was not executed.'
          }

      - name: MSI 및 포터블 패키징
        run: npm run build

      - name: 실제 Windows 입력·포터블·MSI 설치 검증
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/verify-windows.ps1

      - name: 판서 변경분 전송·부분 렌더링 진단
        shell: pwsh
        run: |
          $files = @(Get-ChildItem verification-logs -File -Filter '*interaction-sentinel.json')
          if ($files.Count -ne 2) { throw "Expected both interaction diagnostics, found $($files.Count)." }
          foreach ($file in $files) {
            $result = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
            if (-not $result.success -or -not $result.diagnostics.heldEraserUndo -or -not $result.diagnostics.dirtyCanvasReference.success -or -not $result.diagnostics.deltaTransport.gapRecovered) {
              throw "Missing successful delta/Canvas/cancellation checks: $($file.Name)"
            }
            if ($result.diagnostics.dirtyCanvasReference.exactPixelComparisons -lt 500) { throw 'Canvas reference coverage was reduced.' }
            Write-Host "ANNOTATION_CORE_DIAGNOSTICS $($file.Name)"
            Write-Host ($result | ConvertTo-Json -Depth 12 -Compress)
          }

      - name: 산출물 SHA-256 생성
        shell: pwsh
        run: |
          $files = @(Get-ChildItem output -File | Where-Object { $_.Extension -eq '.msi' -or $_.Name -eq 'MiniCast.exe' })
          if ($files.Count -ne 2) { throw "Expected one MSI and one portable EXE, found $($files.Count)." }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          Set-Content -LiteralPath output/SHA256SUMS.txt -Value $lines -Encoding utf8

      - name: 최종 ZIP 무결성 및 내부 해시 대조
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msiFiles = @(Get-ChildItem output -File -Filter 'MiniCast-*-x64.msi')
          if ($msiFiles.Count -ne 1) { throw "Expected one MSI, found $($msiFiles.Count)." }
          $msi = $msiFiles[0]
          $exe = Get-Item output/MiniCast.exe
          $sums = Get-Item output/SHA256SUMS.txt
          $bundle = Join-Path $PWD ("output/MiniCast-$version-windows.zip")
          Compress-Archive -LiteralPath $msi.FullName, $exe.FullName, $sums.FullName -DestinationPath $bundle -Force
          $extract = Join-Path $env:RUNNER_TEMP ("mini-cast-bundle-" + [Guid]::NewGuid())
          Expand-Archive -LiteralPath $bundle -DestinationPath $extract -Force
          try {
            $entries = @(Get-ChildItem -LiteralPath $extract -File)
            if ($entries.Count -ne 3) { throw "Expected 3 ZIP entries, found $($entries.Count)." }
            $hashLines = @(Get-Content -LiteralPath (Join-Path $extract 'SHA256SUMS.txt'))
            if ($hashLines.Count -ne 2) { throw "Expected 2 internal hashes, found $($hashLines.Count)." }
            foreach ($line in $hashLines) {
              if ($line -notmatch '^([0-9a-f]{64}) \*(.+)$') { throw "Invalid SHA256SUMS line: $line" }
              $target = Join-Path $extract $Matches[2]
              if (-not (Test-Path -LiteralPath $target)) { throw "Missing ZIP entry: $($Matches[2])" }
              $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $Matches[1]) { throw "Hash mismatch for $($Matches[2])." }
            }
          } finally {
            Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          }
          $bundleHash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath output/BUNDLE-SHA256.txt -Value "$bundleHash *$(Split-Path $bundle -Leaf)" -Encoding utf8
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          @{
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            version = $package.version
            electron = $package.devDependencies.electron
            node = (node --version)
            platform = 'windows-2022-x64'
            bundle_sha256 = $bundleHash
          } | ConvertTo-Json | Set-Content -LiteralPath output/BUILD-METADATA.json -Encoding utf8

      - name: Windows 산출물 업로드
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-windows
          path: |
            output/*.msi
            output/MiniCast.exe
            output/SHA256SUMS.txt
            output/MiniCast-*-windows.zip
            output/BUNDLE-SHA256.txt
            output/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 14

      - name: 검증 진단 로그 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-verification-logs
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 14
