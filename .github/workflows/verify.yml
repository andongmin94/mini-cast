name: Verify

# Opt-in verification only. Normal main commits do not trigger Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Windows 검증 및 패키징
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node.js 24 설치
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: 잠금 파일로 의존성 설치
        run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 및 상태 경계 테스트
        run: npm test
      - name: 린트
        run: npm run lint
      - name: 전체 의존성 보안 감사
        run: npm audit --audit-level=low
      - name: 소스 renderer 및 Electron 빌드
        run: npx vite build && npm run build:electron
      - name: 패키징 전 실제 입력·Canvas 참조 비교
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - name: MSI 및 포터블 패키징
        run: npm run build
      - name: 실제 Windows 입력·포터블·MSI 설치 검증
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/verify-windows.ps1
      - name: 판서 변경분 전송·부분 렌더링 진단
        shell: pwsh
        run: ./scripts/verify-diagnostics.ps1
      - name: 최종 ZIP 무결성 및 내부 해시 대조
        shell: pwsh
        run: ./scripts/package-bundle.ps1
      - name: 배포 출처 실패 경계 검사
        shell: pwsh
        run: ./tests/windows/bundle-provenance.test.ps1
      - name: Windows 산출물 업로드
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-windows
          path: |
            output/*.msi
            output/MiniCast.exe
            output/SHA256SUMS.txt
            output/MiniCast-*-windows.zip
            output/BUNDLE-SHA256.txt
            output/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 14
      - name: 검증 진단 로그 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-verification-logs
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 14
