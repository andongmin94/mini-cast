name: Verify

# Release candidates must pass this Windows manual-QA readiness gate.
# Stable controller selectors are verified through the packaged renderer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Windows 검증 및 패키징
    runs-on: windows-2022
    timeout-minutes: 50

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 24 설치
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 잠금 파일로 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 및 상태 경계 테스트
        run: npm test

      - name: 린트
        run: npm run lint

      - name: 전체 의존성 보안 감사
        run: npm audit --audit-level=high

      - name: MSI 및 포터블 패키징
        run: npm run build

      - name: 실제 Windows 입력·포터블·MSI 설치 검증
        shell: pwsh
        run: ./scripts/verify-windows.ps1

      - name: 산출물 SHA-256 생성
        shell: pwsh
        run: |
          $files = @(Get-ChildItem output -File | Where-Object { $_.Extension -eq '.msi' -or $_.Name -eq 'MiniCast.exe' })
          if ($files.Count -ne 2) { throw "Expected one MSI and one portable EXE, found $($files.Count)." }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          Set-Content -LiteralPath output/SHA256SUMS.txt -Value $lines -Encoding utf8

      - name: Windows 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: mini-cast-windows
          path: |
            output/*.msi
            output/MiniCast.exe
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-cast-verification-logs
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 7
