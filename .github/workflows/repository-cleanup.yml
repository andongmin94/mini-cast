name: Repository cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/repository-cleanup.yml]
permissions:
  contents: write
concurrency:
  group: repository-cleanup
  cancel-in-progress: false
jobs:
  organize:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Apply the reviewed file moves and path updates
        run: |
          python .github/reorganize.py
          python -c "from pathlib import Path; p=Path('tests/unit/electron/security-config.test.mjs'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('/^  (?:', '/^ {2}(?:'), encoding='utf-8', newline='\n')"
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, all unit tests, and lint
        run: npm run check
      - name: Full dependency security audit
        run: npm audit --audit-level=low
      - name: Compile relocated renderer and Electron sources
        run: npx vite build && npm run build:electron
      - name: Verify source input and exact Canvas comparisons
        timeout-minutes: 3
        run: ./scripts/verify-source.ps1
      - name: Build Windows packages
        run: npm run build
      - name: Verify input, reload, portable and MSI lifecycle
        timeout-minutes: 10
        run: ./scripts/verify-windows.ps1
      - name: Assert native diagnostics and ZIP integrity
        run: |
          ./scripts/verify-diagnostics.ps1
          ./scripts/package-bundle.ps1
      - name: Commit only the verified organization to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- src tests scripts docs README.md package.json index.html tsconfig.electron.json eslint.config.js .prettierignore
          git rm .github/reorganize.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: organize runtime boundaries, tests, scripts and documentation'
          git diff --exit-code
          git push origin HEAD:main
          git rev-parse HEAD > verification-logs/verified-source-commit.txt
          git ls-tree -r HEAD > verification-logs/verified-source-tree.txt
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-layout-verification
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 7
