name: Repository cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/repository-cleanup.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source before cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cleanup"
          git rev-parse HEAD > "$RUNNER_TEMP/cleanup/source-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/cleanup/source.tar.gz"
      - name: Audit and delete the nine retired branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request, urllib.parse
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'andongmin94/mini-cast'
          expected = {
            'annotation-audit': '474a4294e895373872ffc465b54552adc76f1f04',
            'audit/code-quality': '9a2f01df0789a380b2269ada001ec6f62aded23a',
            'dependency-audit': '474a4294e895373872ffc465b54552adc76f1f04',
            'final-audit-apply': '474a4294e895373872ffc465b54552adc76f1f04',
            'final-audit-snapshot': '474a4294e895373872ffc465b54552adc76f1f04',
            'fix/quality-gate-20260905': '8b422b0d5046da051d5cb6fafe4029af4ba46fa7',
            'perf/annotation-core-20260905': '62364b3e86786cff4f3438cce5d08c77c7bb694b',
            'perf/delta-dirty-render-20260905': '73c739994fbcfaf7a74e022f641511166b2826d2',
            'readiness-audit': 'e124e2a66a808b31e0d3307ceb3146473225aee8',
          }
          def api(path, method='GET'):
              url = ('https://api.github.com/repos/' + repo + '/' + path).rstrip('/')
              req = urllib.request.Request(url, method=method, headers={
                'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert api('')['default_branch'] == 'main'
          live = {b['name']: b['commit']['sha'] for b in api('branches?per_page=100')}
          for name, sha in expected.items():
              if name in live and live[name] != sha:
                  raise RuntimeError('Branch changed; not deleting: ' + name)
          report = {'main_before': live['main'], 'branches': []}
          for name, sha in expected.items():
              if name not in live:
                  continue
              entry = {'branch': name, 'sha': sha,
                'ancestor_of_main': subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/main']).returncode == 0,
                'files_different_from_current_main': git('diff','--name-only','origin/main',sha).splitlines()}
              report['branches'].append(entry)
              print(json.dumps(entry, ensure_ascii=False))
          target = Path(os.environ['RUNNER_TEMP']) / 'cleanup' / 'branches.json'
          target.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          for entry in report['branches']:
              name = entry['branch']
              assert name != 'main'
              ref = urllib.parse.quote('heads/' + name, safe='/')
              if api('git/ref/' + ref)['object']['sha'] != entry['sha']:
                  raise RuntimeError('Branch moved during audit: ' + name)
              api('git/refs/' + ref, 'DELETE')
              entry['deleted'] = True
              target.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          report['remaining'] = [b['name'] for b in api('branches?per_page=100')]
          target.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          assert report['remaining'] == ['main'], report['remaining']
          print('Remaining branch: main')
          PY
      - name: Retain manifest and exact source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-cleanup
          path: ${{ runner.temp }}/cleanup/*
          if-no-files-found: error
          retention-days: 7
