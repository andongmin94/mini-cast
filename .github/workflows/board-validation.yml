name: Presentation board validation

# One-shot execution for the requested increment. Ordinary product pushes do not
# trigger this workflow. Remove this file after verified source publication.
on:
  push:
    branches: [main]
    paths: [.github/workflows/board-validation.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: presentation-board-validation
  cancel-in-progress: false

jobs:
  boards:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout requested work
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Stop only the superseded board validation attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoint = 'repos/andongmin94/mini-cast/actions/runs/33956273624'
          $run = gh api $endpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the superseded validation.' }
          if ($run.status -ne 'completed') {
            if ($run.run_attempt -ne 28) { throw 'Refusing to stop a different validation attempt.' }
            $jobs = gh api "$endpoint/jobs" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $jobs.jobs.Count -ne 1 -or $jobs.jobs[0].id -ne 101436567045) {
              throw 'Refusing to stop an unrelated job.'
            }
            gh api --method POST "$endpoint/cancel"
            if ($LASTEXITCODE -ne 0) {
              $state = gh api $endpoint | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $state.status -ne 'completed') { throw 'Validation cancellation was rejected.' }
            }
            for ($i = 0; $i -lt 10; $i++) {
              $state = gh api $endpoint | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect validation cancellation.' }
              if ($state.status -eq 'completed') { break }
              Start-Sleep -Seconds 2
            }
            if ($state.status -ne 'completed') {
              gh api --method POST "$endpoint/force-cancel"
              if ($LASTEXITCODE -ne 0) {
                $state = gh api $endpoint | ConvertFrom-Json
                if ($LASTEXITCODE -ne 0 -or $state.status -ne 'completed') { throw 'Unresponsive validation could not be stopped.' }
              }
            }
          }
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Apply reviewed presentation backgrounds with failure propagation
        run: |
          @'
          from pathlib import Path
          p = Path('.github/reorganize.py')
          text = p.read_text(encoding='utf-8')
          old = "':!.github/reorganize.py'],check=True)"
          assert text.count(old) == 1, 'Board preparation base guard changed'
          text = text.replace(old, "':!.github/reorganize.py',':!.github/workflows/board-validation.yml'],check=True)")
          p.write_text(text, encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/reorganize.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const p=require('./package.json'); if(p.version!=='0.14.0'||!p.scripts.check.includes('typecheck')) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and regression tests and warning-free lint
        run: npm run check
      - name: Full dependency security audit
        run: npm audit --audit-level=low
      - name: Compile application
        run: |
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source native input and board composition and file isolation
        timeout-minutes: 5
        run: ./scripts/verify-source.ps1
      - name: Build Windows MSI and portable packages
        timeout-minutes: 10
        run: npm run build
      - name: Packaged native input and board recovery and installation lifecycle
        timeout-minutes: 10
        run: ./scripts/verify-windows.ps1
      - name: Assert every native diagnostic
        run: ./scripts/verify-diagnostics.ps1
      - name: Bundle packages and verify internal hashes
        run: ./scripts/package-bundle.ps1
      - name: Publish only verified source and remove preparation script
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- src tests scripts docs README.md package.json package-lock.json index.html tsconfig.electron.json eslint.config.js .prettierignore
          git diff --cached --binary > verification-logs/verified-source.patch
          git restore --worktree -- .github/reorganize.py
          git rm .github/reorganize.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add monitor-scoped whiteboard and blackboard backgrounds'
          git diff --exit-code
          git push origin HEAD:main
          git rev-parse HEAD > verification-logs/verified-source-commit.txt
          git ls-tree -r HEAD > verification-logs/verified-source-tree.txt
          node --input-type=module -e 'import fs from "node:fs"; import cp from "node:child_process"; const p="output/BUILD-METADATA.json"; const m=JSON.parse(fs.readFileSync(p,"utf8").replace(/^\uFEFF/,"")); m.workflow_commit=m.commit; m.commit=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(); fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n");'
      - name: Retain validated Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-windows
          path: |
            output/MiniCast-*-windows.zip
            output/SHA256SUMS.txt
            output/BUNDLE-SHA256.txt
            output/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: presentation-board-verification
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 7
