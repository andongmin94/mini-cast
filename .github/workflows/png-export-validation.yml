name: PNG export validation

# One-shot execution for the explicitly requested export increment. Product
# commits do not trigger this job. The successful job removes this file.
on:
  push:
    branches: [main]
    paths: [.github/workflows/png-export-validation.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-cleanup
  cancel-in-progress: true

jobs:
  png-export:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout requested work
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Apply reviewed export changes with explicit failure propagation
        run: |
          @'
          from pathlib import Path
          p = Path('.github/reorganize.py')
          text = p.read_text(encoding='utf-8')
          old = "':!.github/reorganize.py'],check=True)"
          assert text.count(old) == 1, 'Preparation base guard changed'
          text = text.replace(old, "':!.github/reorganize.py',':!.github/workflows/png-export-validation.yml'],check=True)")
          p.write_text(text, encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/reorganize.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const p=require('./package.json'); if(p.version!=='0.12.0'||!p.scripts.check.includes('typecheck')) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and regression tests and warning-free lint
        run: npm run check
      - name: Full dependency audit
        run: npm audit --audit-level=low
      - name: Compile source application
        run: |
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source native save dialog and PNG and clipboard verification
        timeout-minutes: 5
        run: ./scripts/verify-source.ps1
      - name: Build MSI and portable packages
        timeout-minutes: 10
        run: npm run build
      - name: Packaged native input and export and install lifecycle
        timeout-minutes: 10
        run: ./scripts/verify-windows.ps1
      - name: Verify all native diagnostics
        run: ./scripts/verify-diagnostics.ps1
      - name: Bundle and verify internal hashes
        run: ./scripts/package-bundle.ps1
      - name: Publish only verified source and remove preparation files
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- src tests scripts docs README.md package.json package-lock.json index.html tsconfig.electron.json eslint.config.js .prettierignore
          git rm .github/reorganize.py .github/workflows/png-export-validation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: export transparent annotation PNGs and copy images'
          git diff --exit-code
          git push origin HEAD:main
          git rev-parse HEAD > verification-logs/verified-source-commit.txt
          git ls-tree -r HEAD > verification-logs/verified-source-tree.txt
          node --input-type=module -e 'import fs from "node:fs"; import cp from "node:child_process"; const p="output/BUILD-METADATA.json"; const m=JSON.parse(fs.readFileSync(p,"utf8").replace(/^\uFEFF/,"")); m.workflow_commit=m.commit; m.commit=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(); fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n");'
      - name: Retain validated Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-cast-windows
          path: |
            output/MiniCast-*-windows.zip
            output/SHA256SUMS.txt
            output/BUNDLE-SHA256.txt
            output/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: png-export-verification
          path: verification-logs/**/*
          if-no-files-found: ignore
          retention-days: 7
